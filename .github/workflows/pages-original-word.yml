name: Publish original Word app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'original-word-app/**'
      - '.github/workflows/pages-original-word.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: original-word-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: original-word-app

      - name: Revisar tipos
        run: npm run lint
        working-directory: original-word-app

      - name: Compilar para GitHub Pages
        run: npm run build
        working-directory: original-word-app
        env:
          GITHUB_PAGES: 'true'

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: original-word-app/dist

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4